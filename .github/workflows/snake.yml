name: Generate Snake Animation

on:
  # jalan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # bisa dijalankan manual dari tab Actions
  workflow_dispatch:
  # jalan setiap ada push ke branch utama
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=000000&color_dots=#ebedf0,#c9ccd1,#9aa0a6,#5f6368,#000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=ffffff&color_dots=#161b22,#30363d,#6e7681,#9198a1,#ffffff

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
